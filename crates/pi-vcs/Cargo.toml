[package]
name = "pi-vcs"
version.workspace = true
edition.workspace = true
license = "MIT"
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
futures.workspace = true
gix.workspace = true
gix-utils = { version = "0.3.6", default-features = false }
jj-lib.workspace = true
pi-iso.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
# jj-lib's own gix: `Workspace::init_internal_git` takes its `hash::Kind`, which
# is a different type from the 0.85 the git backend links.
jj-gix = { package = "gix", version = "0.87.1", default-features = false }
tempfile = "3"
