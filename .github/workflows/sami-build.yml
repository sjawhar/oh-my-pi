name: Build sami branch

on:
  push:
    branches:
      - sami
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      timestamp: ${{ steps.version.outputs.timestamp }}
    steps:
      - uses: actions/checkout@v4
      - uses: sjawhar/.github/.github/actions/sami-version@v1
        id: version
        with:
          source: bun
          manifest_path: packages/coding-agent/package.json

  release_binary:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
            native_targets: linux-x64-baseline linux-x64-modern
          - runner: macos-14
            target: darwin-arm64
            native_targets: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/bazel-natives
        with:
          targets: ${{ matrix.native_targets }}
          cache-scope: fork-release-${{ matrix.target }}
      - name: Build binary
        env:
          RELEASE_TARGETS: ${{ matrix.target }}
        run: bun run ci:release:build-binaries
      - name: Smoke test binary
        run: |
          runtime_dir="$(mktemp -d)"
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/data" \
            ./packages/coding-agent/binaries/omp-${{ matrix.target }} --version
      - name: Package mise asset
        env:
          TAG: ${{ needs.version.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          asset="omp-${TAG}-${TARGET}"
          mkdir -p "release/${asset}/bin"
          cp "packages/coding-agent/binaries/omp-${TARGET}" "release/${asset}/bin/omp"
          tar -C release -czf "release/${asset}.tar.gz" "$asset"
      - uses: actions/upload-artifact@v4
        with:
          name: mise-${{ matrix.target }}
          path: release/*.tar.gz
          if-no-files-found: error

  release_github:
    needs: [version, release_binary]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mise-*
          path: release
          merge-multiple: true
      - uses: sjawhar/.github/.github/actions/sami-release@v1
        with:
          tag: ${{ needs.version.outputs.tag }}
          files: release/*.tar.gz
