name: Fork Release

on:
  push:
    tags:
      - "fork-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Fork-only release tag, for example fork-v17.3.4-resize.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release_metadata:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - id: release
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in
            fork-v*) ;;
            *)
              echo "Fork release tags must start with fork-v: $TAG" >&2
              exit 1
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  release_binary:
    needs: release_metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
            native_targets: linux-x64-baseline linux-x64-modern
          - runner: macos-14
            target: darwin-arm64
            native_targets: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/bazel-natives
        with:
          targets: ${{ matrix.native_targets }}
          cache-scope: fork-release-${{ matrix.target }}
      - name: Build binary
        env:
          RELEASE_TARGETS: ${{ matrix.target }}
        run: bun run ci:release:build-binaries
      - name: Smoke test binary
        run: |
          runtime_dir="$(mktemp -d)"
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/data" \
            ./packages/coding-agent/binaries/omp-${{ matrix.target }} --version
      - name: Package mise asset
        env:
          TAG: ${{ needs.release_metadata.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          asset="omp-${TAG}-${TARGET}"
          mkdir -p "release/${asset}/bin"
          cp "packages/coding-agent/binaries/omp-${TARGET}" "release/${asset}/bin/omp"
          tar -C release -czf "release/${asset}.tar.gz" "$asset"
      - uses: actions/upload-artifact@v4
        with:
          name: mise-${{ matrix.target }}
          path: release/*.tar.gz
          if-no-files-found: error

  release_github:
    needs: [release_metadata, release_binary]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mise-*
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release_metadata.outputs.tag }}
        run: gh release create "$TAG" release/*.tar.gz --target "$GITHUB_SHA" --title "$TAG" --generate-notes
